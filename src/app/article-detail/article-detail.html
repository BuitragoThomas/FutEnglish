<app-navbar [nivelTexto]="'Nivel: ' + (article()?.level ?? 'B1')"></app-navbar>
<main class="container py-5">
  @if (loading()) {
    <p class="text-center text-secondary">Cargando noticia...</p>
  } @else if (article(); as a) {
    <a routerLink="/feed" [queryParams]="{ level: a.level }" class="btn btn-outline-secondary btn-sm mb-4">← Volver al feed</a>
    <div><span class="badge bg-success mb-2">{{ a.league }} · {{ a.level }}</span></div>
    <h1 class="fw-bold">{{ a.title }}</h1>
    <p class="text-muted">🕒 {{ a.readTime }} min de lectura</p>
    <p class="fs-5">{{ a.content }}</p>
  } @else {
    <div class="text-center">
      <h2>Noticia no encontrada</h2>
      <a routerLink="/feed" class="btn btn-success mt-3">Ir al feed</a>
    </div>
  }
</main>
<app-footer></app-footer>
